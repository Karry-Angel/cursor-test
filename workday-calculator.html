<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年度工作日计算器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 2rem;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #4a4a6a;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .card-title .icon.blue { background: #eef2ff; }
        .card-title .icon.green { background: #ecfdf5; }
        .card-title .icon.orange { background: #fff7ed; }
        .card-title .icon.purple { background: #f5f3ff; }

        .form-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        label {
            font-size: 0.9rem;
            color: #555;
            min-width: 60px;
        }

        select, input[type="date"] {
            padding: 8px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #333;
            background: #fafafa;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        select:focus, input[type="date"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .period-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #f8f9fb;
            border-radius: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .period-row .period-label {
            font-size: 0.85rem;
            color: #667eea;
            font-weight: 600;
            min-width: 50px;
        }

        .period-row span.dash {
            color: #999;
            font-weight: 600;
        }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f5;
            color: #555;
        }

        .btn-secondary:hover { background: #e5e5ee; }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-danger:hover { background: #fecaca; }

        .btn-add {
            background: #ecfdf5;
            color: #059669;
            border: 2px dashed #a7f3d0;
            width: 100%;
            padding: 10px;
            margin-top: 4px;
        }

        .btn-add:hover { background: #d1fae5; border-color: #6ee7b7; }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            color: #fff;
        }

        .stat-card .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-card .stat-label {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        .stat-card .stat-sub {
            font-size: 0.78rem;
            opacity: 0.75;
            margin-top: 2px;
        }

        /* 进度条 */
        .progress-section {
            margin-bottom: 24px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #555;
        }

        .progress-bar-bg {
            height: 24px;
            background: #f0f0f5;
            border-radius: 12px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 12px;
            transition: width 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #fff;
            font-weight: 600;
            min-width: 40px;
        }

        /* 月度明细表 */
        .detail-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
        }

        .detail-table thead th {
            background: #f8f9fb;
            padding: 12px 14px;
            font-size: 0.85rem;
            color: #666;
            font-weight: 600;
            text-align: center;
            border-bottom: 2px solid #e5e7eb;
        }

        .detail-table thead th:first-child {
            border-radius: 10px 0 0 0;
            text-align: left;
        }

        .detail-table thead th:last-child {
            border-radius: 0 10px 0 0;
        }

        .detail-table tbody td {
            padding: 11px 14px;
            font-size: 0.88rem;
            text-align: center;
            border-bottom: 1px solid #f0f0f5;
        }

        .detail-table tbody td:first-child {
            text-align: left;
            font-weight: 500;
            color: #4a4a6a;
        }

        .detail-table tbody tr:hover {
            background: #fafaff;
        }

        .detail-table tbody tr:last-child td {
            border-bottom: none;
        }

        .detail-table tfoot td {
            padding: 12px 14px;
            font-weight: 700;
            text-align: center;
            border-top: 2px solid #e5e7eb;
            background: #f8f9fb;
            color: #4a4a6a;
        }

        .detail-table tfoot td:first-child {
            text-align: left;
            border-radius: 0 0 0 10px;
        }

        .detail-table tfoot td:last-child {
            border-radius: 0 0 10px 0;
        }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .badge-green { background: #ecfdf5; color: #059669; }
        .badge-red { background: #fef2f2; color: #dc2626; }
        .badge-gray { background: #f3f4f6; color: #6b7280; }
        .badge-blue { background: #eef2ff; color: #4f46e5; }

        /* 日历视图 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 12px;
        }

        .month-calendar {
            background: #fafbfc;
            border-radius: 12px;
            padding: 14px;
        }

        .month-calendar .month-title {
            text-align: center;
            font-weight: 600;
            color: #4a4a6a;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .week-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.75rem;
            color: #999;
            margin-bottom: 4px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }

        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            border-radius: 8px;
            position: relative;
            cursor: default;
        }

        .day-cell.empty { visibility: hidden; }
        .day-cell.weekend { color: #999; background: #f5f5f5; }
        .day-cell.holiday { color: #dc2626; background: #fef2f2; }
        .day-cell.makeup { color: #059669; background: #ecfdf5; }
        .day-cell.worked { color: #fff; background: linear-gradient(135deg, #667eea, #764ba2); font-weight: 600; }
        .day-cell.today { box-shadow: 0 0 0 2px #f59e0b; }

        .day-cell[title] { cursor: help; }

        /* 图例 */
        .legend {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-top: 14px;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #666;
        }

        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }

        .legend-dot.l-worked { background: linear-gradient(135deg, #667eea, #764ba2); }
        .legend-dot.l-weekend { background: #f5f5f5; border: 1px solid #ddd; }
        .legend-dot.l-holiday { background: #fef2f2; border: 1px solid #fecaca; }
        .legend-dot.l-makeup { background: #ecfdf5; border: 1px solid #a7f3d0; }
        .legend-dot.l-normal { background: #fff; border: 1px solid #ddd; }

        /* 隐藏结果区 */
        .results-area { display: none; }
        .results-area.show { display: block; }

        /* 节假日设置 */
        .holiday-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .holiday-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            background: #fef2f2;
            color: #dc2626;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .makeup-tag {
            background: #ecfdf5;
            color: #059669;
        }

        .holiday-tag .remove-tag {
            cursor: pointer;
            font-weight: 700;
            margin-left: 2px;
            opacity: 0.6;
        }

        .holiday-tag .remove-tag:hover { opacity: 1; }

        .inline-add {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .inline-add input[type="date"] {
            padding: 6px 10px;
            font-size: 0.85rem;
        }

        .inline-add .btn {
            padding: 6px 14px;
            font-size: 0.82rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            color: #555;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .hint {
            font-size: 0.8rem;
            color: #999;
            margin-top: 4px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .card { padding: 18px; }
            h1 { font-size: 1.5rem; }
            .stat-card .stat-value { font-size: 1.6rem; }
            .period-row { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>年度工作日计算器</h1>
        <p class="subtitle">输入上班时间段，计算你这一年工作了多少天</p>

        <!-- 基本设置 -->
        <div class="card">
            <div class="card-title"><span class="icon blue">📅</span>基本设置</div>
            <div class="form-row">
                <label>选择年份</label>
                <select id="yearSelect"></select>
                <label class="checkbox-label" style="margin-left: 20px;">
                    <input type="checkbox" id="useHolidays" checked>
                    启用中国法定节假日
                </label>
            </div>
        </div>

        <!-- 上班时间段 -->
        <div class="card">
            <div class="card-title"><span class="icon green">⏰</span>上班时间段</div>
            <p class="hint" style="margin-bottom: 12px;">支持添加多段上班时间，比如你中间换了工作或有空档期</p>
            <div id="periodsContainer"></div>
            <button class="btn btn-add" onclick="addPeriod()">+ 添加一段上班时间</button>
        </div>

        <!-- 节假日设置 -->
        <div class="card" id="holidayCard">
            <div class="card-title"><span class="icon orange">🏖️</span>节假日 / 补班日设置</div>
            <p class="hint" style="margin-bottom: 10px;">系统已预置 2024-2026 年中国法定节假日数据，你也可以手动增减</p>

            <div style="margin-bottom: 12px;">
                <strong style="font-size: 0.88rem; color: #dc2626;">休假日（不上班）：</strong>
                <div class="holiday-tags" id="holidayTags"></div>
                <div class="inline-add">
                    <input type="date" id="addHolidayDate">
                    <input type="text" id="addHolidayName" placeholder="假日名称（可选）"
                        style="padding:6px 10px;border:2px solid #e5e7eb;border-radius:10px;font-size:0.85rem;outline:none;width:140px;">
                    <button class="btn btn-secondary" onclick="addCustomHoliday()">添加休假日</button>
                </div>
            </div>

            <div>
                <strong style="font-size: 0.88rem; color: #059669;">补班日（要上班的周末）：</strong>
                <div class="holiday-tags" id="makeupTags"></div>
                <div class="inline-add">
                    <input type="date" id="addMakeupDate">
                    <button class="btn btn-secondary" onclick="addCustomMakeup()">添加补班日</button>
                </div>
            </div>
        </div>

        <!-- 计算按钮 -->
        <div style="text-align: center; margin-bottom: 20px;">
            <button class="btn btn-primary" style="padding: 14px 60px; font-size: 1.05rem; border-radius: 14px;" onclick="calculate()">
                开始计算
            </button>
        </div>

        <!-- 结果区域 -->
        <div class="results-area" id="resultsArea">
            <!-- 统计概览 -->
            <div class="card">
                <div class="card-title"><span class="icon purple">📊</span>统计概览</div>
                <div class="stats-grid" id="statsGrid"></div>
                <div class="progress-section" id="progressSection"></div>
            </div>

            <!-- 月度明细 -->
            <div class="card">
                <div class="card-title"><span class="icon blue">📋</span>月度明细</div>
                <div style="overflow-x: auto;">
                    <table class="detail-table" id="detailTable"></table>
                </div>
            </div>

            <!-- 日历视图 -->
            <div class="card">
                <div class="card-title"><span class="icon green">🗓️</span>日历视图</div>
                <div class="legend">
                    <div class="legend-item"><div class="legend-dot l-worked"></div>已上班</div>
                    <div class="legend-item"><div class="legend-dot l-normal"></div>工作日（未上班）</div>
                    <div class="legend-item"><div class="legend-dot l-weekend"></div>周末</div>
                    <div class="legend-item"><div class="legend-dot l-holiday"></div>法定假日</div>
                    <div class="legend-item"><div class="legend-dot l-makeup"></div>补班日</div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </div>
    </div>

<script>
// ==================== 节假日数据 ====================
// 格式: { 'YYYY-MM-DD': '假日名称' }
const HOLIDAYS_DATA = {
    2024: {
        holidays: {
            '2024-01-01': '元旦',
            '2024-02-10': '春节', '2024-02-11': '春节', '2024-02-12': '春节',
            '2024-02-13': '春节', '2024-02-14': '春节', '2024-02-15': '春节',
            '2024-02-16': '春节', '2024-02-17': '春节',
            '2024-04-04': '清明节', '2024-04-05': '清明节', '2024-04-06': '清明节',
            '2024-05-01': '劳动节', '2024-05-02': '劳动节', '2024-05-03': '劳动节',
            '2024-05-04': '劳动节', '2024-05-05': '劳动节',
            '2024-06-08': '端午节', '2024-06-09': '端午节', '2024-06-10': '端午节',
            '2024-09-15': '中秋节', '2024-09-16': '中秋节', '2024-09-17': '中秋节',
            '2024-10-01': '国庆节', '2024-10-02': '国庆节', '2024-10-03': '国庆节',
            '2024-10-04': '国庆节', '2024-10-05': '国庆节', '2024-10-06': '国庆节',
            '2024-10-07': '国庆节',
        },
        makeup: ['2024-02-04', '2024-02-18', '2024-04-07', '2024-04-28', '2024-05-11', '2024-09-14', '2024-09-29', '2024-10-12']
    },
    2025: {
        holidays: {
            '2025-01-01': '元旦',
            '2025-01-28': '春节', '2025-01-29': '春节', '2025-01-30': '春节',
            '2025-01-31': '春节', '2025-02-01': '春节', '2025-02-02': '春节',
            '2025-02-03': '春节', '2025-02-04': '春节',
            '2025-04-04': '清明节', '2025-04-05': '清明节', '2025-04-06': '清明节',
            '2025-05-01': '劳动节', '2025-05-02': '劳动节', '2025-05-03': '劳动节',
            '2025-05-04': '劳动节', '2025-05-05': '劳动节',
            '2025-05-31': '端午节', '2025-06-01': '端午节', '2025-06-02': '端午节',
            '2025-10-01': '国庆节/中秋节', '2025-10-02': '国庆节', '2025-10-03': '国庆节',
            '2025-10-04': '国庆节', '2025-10-05': '国庆节', '2025-10-06': '国庆节',
            '2025-10-07': '国庆节', '2025-10-08': '国庆节',
        },
        makeup: ['2025-01-26', '2025-02-08', '2025-04-27', '2025-09-28', '2025-10-11']
    },
    2026: {
        holidays: {
            '2026-01-01': '元旦', '2026-01-02': '元旦', '2026-01-03': '元旦',
            '2026-02-17': '春节', '2026-02-18': '春节', '2026-02-19': '春节',
            '2026-02-20': '春节', '2026-02-21': '春节', '2026-02-22': '春节',
            '2026-02-23': '春节',
            '2026-04-05': '清明节', '2026-04-06': '清明节', '2026-04-07': '清明节',
            '2026-05-01': '劳动节', '2026-05-02': '劳动节', '2026-05-03': '劳动节',
            '2026-05-04': '劳动节', '2026-05-05': '劳动节',
            '2026-06-19': '端午节', '2026-06-20': '端午节', '2026-06-21': '端午节',
            '2026-10-01': '国庆节', '2026-10-02': '国庆节', '2026-10-03': '国庆节',
            '2026-10-04': '国庆节', '2026-10-05': '国庆节', '2026-10-06': '国庆节',
            '2026-10-07': '国庆节',
        },
        makeup: ['2026-02-15', '2026-02-28', '2026-04-26', '2026-10-10']
    }
};

// ==================== 状态 ====================
let currentYear = new Date().getFullYear();
let holidays = {};   // 'YYYY-MM-DD' -> name
let makeupDays = new Set(); // 补班日
let periodCounter = 0;

// ==================== 初始化 ====================
function init() {
    const yearSel = document.getElementById('yearSelect');
    for (let y = 2020; y <= 2030; y++) {
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y + ' 年';
        if (y === currentYear) opt.selected = true;
        yearSel.appendChild(opt);
    }
    yearSel.addEventListener('change', () => {
        currentYear = parseInt(yearSel.value);
        loadHolidayData();
        updatePeriodDateLimits();
    });

    document.getElementById('useHolidays').addEventListener('change', () => {
        document.getElementById('holidayCard').style.display =
            document.getElementById('useHolidays').checked ? 'block' : 'none';
        loadHolidayData();
    });

    loadHolidayData();
    addPeriod(); // 默认添加一段
}

function loadHolidayData() {
    holidays = {};
    makeupDays = new Set();

    if (document.getElementById('useHolidays').checked && HOLIDAYS_DATA[currentYear]) {
        const data = HOLIDAYS_DATA[currentYear];
        holidays = { ...data.holidays };
        data.makeup.forEach(d => makeupDays.add(d));
    }

    renderHolidayTags();
    renderMakeupTags();
}

// ==================== 时间段管理 ====================
function addPeriod() {
    periodCounter++;
    const container = document.getElementById('periodsContainer');
    const div = document.createElement('div');
    div.className = 'period-row';
    div.id = `period-${periodCounter}`;
    const id = periodCounter;
    const yearStart = `${currentYear}-01-01`;
    const yearEnd = `${currentYear}-12-31`;

    div.innerHTML = `
        <span class="period-label">时段 ${id}</span>
        <label>从</label>
        <input type="date" class="period-start" min="${yearStart}" max="${yearEnd}" value="${yearStart}">
        <span class="dash">—</span>
        <label>到</label>
        <input type="date" class="period-end" min="${yearStart}" max="${yearEnd}" value="${yearEnd}">
        <button class="btn btn-danger" onclick="removePeriod(${id})">删除</button>
    `;
    container.appendChild(div);
}

function removePeriod(id) {
    const el = document.getElementById(`period-${id}`);
    if (el) el.remove();
    // 至少保留一个
    if (document.querySelectorAll('.period-row').length === 0) addPeriod();
}

function updatePeriodDateLimits() {
    const yearStart = `${currentYear}-01-01`;
    const yearEnd = `${currentYear}-12-31`;
    document.querySelectorAll('.period-start, .period-end').forEach(input => {
        input.min = yearStart;
        input.max = yearEnd;
    });
}

function getPeriods() {
    const periods = [];
    document.querySelectorAll('.period-row').forEach(row => {
        const start = row.querySelector('.period-start').value;
        const end = row.querySelector('.period-end').value;
        if (start && end) periods.push({ start, end });
    });
    return periods;
}

// ==================== 节假日标签管理 ====================
function renderHolidayTags() {
    const container = document.getElementById('holidayTags');
    const sorted = Object.keys(holidays).sort();
    container.innerHTML = sorted.map(d =>
        `<span class="holiday-tag" title="${d}">
            ${holidays[d]}(${d.slice(5)})
            <span class="remove-tag" onclick="removeHoliday('${d}')">&times;</span>
        </span>`
    ).join('');
}

function renderMakeupTags() {
    const container = document.getElementById('makeupTags');
    const sorted = [...makeupDays].sort();
    container.innerHTML = sorted.map(d =>
        `<span class="holiday-tag makeup-tag" title="${d}">
            ${d.slice(5)}
            <span class="remove-tag" onclick="removeMakeup('${d}')">&times;</span>
        </span>`
    ).join('');
}

function removeHoliday(d) { delete holidays[d]; renderHolidayTags(); }
function removeMakeup(d) { makeupDays.delete(d); renderMakeupTags(); }

function addCustomHoliday() {
    const dateInput = document.getElementById('addHolidayDate');
    const nameInput = document.getElementById('addHolidayName');
    if (!dateInput.value) return;
    holidays[dateInput.value] = nameInput.value || '自定义假日';
    dateInput.value = '';
    nameInput.value = '';
    renderHolidayTags();
}

function addCustomMakeup() {
    const dateInput = document.getElementById('addMakeupDate');
    if (!dateInput.value) return;
    makeupDays.add(dateInput.value);
    dateInput.value = '';
    renderMakeupTags();
}

// ==================== 日期工具 ====================
function dateStr(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${dd}`;
}

function isWeekend(d) {
    const day = d.getDay();
    return day === 0 || day === 6;
}

function isHoliday(dStr) {
    return document.getElementById('useHolidays').checked && holidays.hasOwnProperty(dStr);
}

function isMakeupDay(dStr) {
    return document.getElementById('useHolidays').checked && makeupDays.has(dStr);
}

function isWorkingDay(d) {
    const dStr = dateStr(d);
    // 补班日（虽然是周末但要上班）
    if (isMakeupDay(dStr)) return true;
    // 法定假日（虽然是工作日但不上班）
    if (isHoliday(dStr)) return false;
    // 普通周末
    if (isWeekend(d)) return false;
    return true;
}

function isInPeriods(dStr, periods) {
    return periods.some(p => dStr >= p.start && dStr <= p.end);
}

// ==================== 计算 ====================
function calculate() {
    const periods = getPeriods();
    if (periods.length === 0) {
        alert('请至少添加一段上班时间');
        return;
    }

    // 验证日期
    for (const p of periods) {
        if (p.start > p.end) {
            alert('上班时间段的起始日期不能晚于结束日期');
            return;
        }
    }

    const year = currentYear;
    const monthlyData = [];
    let totalCalendarDays = 0;
    let totalWorkingDays = 0;
    let totalWorkedDays = 0;
    let totalHolidayDays = 0;
    let totalWeekendDays = 0;
    let totalMakeupDays = 0;

    // 逐月统计
    for (let m = 0; m < 12; m++) {
        const daysInMonth = new Date(year, m + 1, 0).getDate();
        let mCalendar = 0, mWorking = 0, mWorked = 0, mHoliday = 0, mWeekend = 0, mMakeup = 0;

        for (let day = 1; day <= daysInMonth; day++) {
            const d = new Date(year, m, day);
            const dStr = dateStr(d);
            mCalendar++;

            const weekend = isWeekend(d);
            const holiday = isHoliday(dStr);
            const makeup = isMakeupDay(dStr);

            if (makeup) mMakeup++;
            if (holiday) mHoliday++;
            if (weekend && !makeup) mWeekend++;

            if (isWorkingDay(d)) {
                mWorking++;
                if (isInPeriods(dStr, periods)) {
                    mWorked++;
                }
            }
        }

        monthlyData.push({
            month: m + 1,
            calendarDays: mCalendar,
            workingDays: mWorking,
            workedDays: mWorked,
            holidayDays: mHoliday,
            weekendDays: mWeekend,
            makeupDays: mMakeup,
        });

        totalCalendarDays += mCalendar;
        totalWorkingDays += mWorking;
        totalWorkedDays += mWorked;
        totalHolidayDays += mHoliday;
        totalWeekendDays += mWeekend;
        totalMakeupDays += mMakeup;
    }

    const percentage = totalWorkingDays > 0 ? (totalWorkedDays / totalWorkingDays * 100) : 0;

    // 渲染结果
    renderStats(totalCalendarDays, totalWorkingDays, totalWorkedDays, totalHolidayDays, totalWeekendDays, percentage);
    renderProgress(totalWorkedDays, totalWorkingDays, percentage);
    renderDetailTable(monthlyData, totalCalendarDays, totalWorkingDays, totalWorkedDays, totalHolidayDays, totalWeekendDays);
    renderCalendar(year, periods);

    document.getElementById('resultsArea').classList.add('show');
    document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderStats(calDays, workDays, workedDays, holidayDays, weekendDays, pct) {
    document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card" style="--bg1:#667eea;--bg2:#764ba2;">
            <div class="stat-value">${workedDays}</div>
            <div class="stat-label">实际上班天数</div>
        </div>
        <div class="stat-card" style="--bg1:#f093fb;--bg2:#f5576c;">
            <div class="stat-value">${workDays}</div>
            <div class="stat-label">全年工作日</div>
            <div class="stat-sub">（排除周末和假日）</div>
        </div>
        <div class="stat-card" style="--bg1:#4facfe;--bg2:#00f2fe;">
            <div class="stat-value">${pct.toFixed(1)}%</div>
            <div class="stat-label">工作日占比</div>
        </div>
        <div class="stat-card" style="--bg1:#43e97b;--bg2:#38f9d7;">
            <div class="stat-value">${workDays - workedDays}</div>
            <div class="stat-label">未上班工作日</div>
        </div>
    `;
}

function renderProgress(worked, total, pct) {
    document.getElementById('progressSection').innerHTML = `
        <div class="progress-header">
            <span>上班进度</span>
            <span>${worked} / ${total} 天</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${Math.min(pct, 100)}%">${pct.toFixed(1)}%</div>
        </div>
    `;
}

function renderDetailTable(data, totalCal, totalWork, totalWorked, totalHoliday, totalWeekend) {
    const table = document.getElementById('detailTable');
    table.innerHTML = `
        <thead>
            <tr>
                <th>月份</th>
                <th>自然日</th>
                <th>周末天数</th>
                <th>假日天数</th>
                <th>应出勤</th>
                <th>实际出勤</th>
                <th>出勤率</th>
                <th>状态</th>
            </tr>
        </thead>
        <tbody>
            ${data.map(d => {
                const rate = d.workingDays > 0 ? (d.workedDays / d.workingDays * 100) : 0;
                let badge = '';
                if (d.workedDays === 0) badge = '<span class="badge badge-gray">未上班</span>';
                else if (rate >= 100) badge = '<span class="badge badge-green">全勤</span>';
                else if (rate > 0) badge = '<span class="badge badge-blue">部分</span>';
                return `<tr>
                    <td>${d.month} 月</td>
                    <td>${d.calendarDays}</td>
                    <td>${d.weekendDays}</td>
                    <td>${d.holidayDays}</td>
                    <td>${d.workingDays}</td>
                    <td><strong>${d.workedDays}</strong></td>
                    <td>${rate.toFixed(1)}%</td>
                    <td>${badge}</td>
                </tr>`;
            }).join('')}
        </tbody>
        <tfoot>
            <tr>
                <td>合计</td>
                <td>${totalCal}</td>
                <td>${totalWeekend}</td>
                <td>${totalHoliday}</td>
                <td>${totalWork}</td>
                <td><strong>${totalWorked}</strong></td>
                <td>${totalWork > 0 ? (totalWorked / totalWork * 100).toFixed(1) : 0}%</td>
                <td></td>
            </tr>
        </tfoot>
    `;
}

function renderCalendar(year, periods) {
    const grid = document.getElementById('calendarGrid');
    const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
    const todayStr = dateStr(new Date());
    let html = '';

    for (let m = 0; m < 12; m++) {
        const daysInMonth = new Date(year, m + 1, 0).getDate();
        const firstDay = new Date(year, m, 1).getDay(); // 0=Sunday

        html += `<div class="month-calendar">
            <div class="month-title">${m + 1} 月</div>
            <div class="week-header">${weekNames.map(w => `<div>${w}</div>`).join('')}</div>
            <div class="days-grid">`;

        // 空白占位
        for (let i = 0; i < firstDay; i++) {
            html += '<div class="day-cell empty"></div>';
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const d = new Date(year, m, day);
            const dStr = dateStr(d);
            const weekend = isWeekend(d);
            const holiday = isHoliday(dStr);
            const makeup = isMakeupDay(dStr);
            const working = isWorkingDay(d);
            const inPeriod = isInPeriods(dStr, periods);
            const isToday = dStr === todayStr;

            let cls = 'day-cell';
            let title = '';

            if (working && inPeriod) {
                cls += ' worked';
                title = '已上班';
            } else if (holiday) {
                cls += ' holiday';
                title = holidays[dStr] || '假日';
            } else if (makeup) {
                cls += ' makeup';
                title = '补班日' + (inPeriod ? '（已上班）' : '');
                if (inPeriod) cls = 'day-cell worked';
            } else if (weekend) {
                cls += ' weekend';
                title = '周末';
            }

            if (isToday) cls += ' today';

            html += `<div class="${cls}" title="${title}">${day}</div>`;
        }

        html += '</div></div>';
    }

    grid.innerHTML = html;
}

// 启动
init();
</script>
